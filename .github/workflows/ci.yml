name: TRENCH CI Builds
on:
  push:
    tags:
      - '**'
    branches:
      - master
  pull_request:

permissions:
  packages: write
  contents: write

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        tb-build-type: [release]
    env:
      USERNAME: gbolanho
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      FEED_URL: https://nuget.pkg.github.com/gbolanho/index.json
      # CORREÇÃO: Apontando totalmente para o seu repositório de pacotes
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/gbolanho/index.json,readwrite"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'

      # --- WINDOWS SECTION ---
      - name: Windows - Bootstrap vcpkg
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat

      - name: Windows - Install dependencies
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/2.11.3.1/pandoc-2.11.3.1-windows-x86_64.zip' -OutFile 'pandoc.zip'
          7z x pandoc.zip -o'.'
          $tb_pandoc_path = "$(pwd)\pandoc-2.11.3.1"
          echo "$tb_pandoc_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Windows - Add NuGet sources
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: |
          .$(${{ env.VCPKG_EXE }} fetch nuget) sources add -Source "${{ env.FEED_URL }}" -StorePasswordInClearText -Name GitHubPackages -UserName "${{ env.USERNAME }}" -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(${{ env.VCPKG_EXE }} fetch nuget) setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "${{ env.FEED_URL }}"

      - name: Windows - Build
        if: ${{ matrix.os == 'windows-2022' }}
        # FORÇANDO O DESLIGAMENTO DOS TESTES E AVISOS
        run: |
          set CMAKE_ARGS="-DTB_BUILD_UNIT_TESTS=OFF -DTB_WARNINGS_AS_ERRORS=OFF"
          cmd.exe /c CI-windows.bat

      - name: Windows - Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'windows-2022' }}
        with:
          name: TRENCH-Windows
          path: |
            cmakebuild/*.zip
            cmakebuild/*.zip.md5

      # --- LINUX SECTION ---
      - name: Linux - Bootstrap vcpkg
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Linux - Install dependencies
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install gcc-13 g++-13 build-essential libxi-dev libxrandr-dev libxxf86vm-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libglm-dev pandoc cmake p7zip-full ninja-build xvfb libglew-dev libfreeimage-dev libfreetype6-dev libtinyxml2-dev libassimp-dev libfuse2

      - name: Linux - Add NuGet sources
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: |
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` sources add -Source "${{ env.FEED_URL }}" -StorePasswordInClearText -Name GitHubPackages -UserName "${{ env.USERNAME }}" -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "${{ env.FEED_URL }}"

      - name: Linux - Build
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          export CC=gcc-13
          export CXX=g++-13
          # FORÇANDO O DESLIGAMENTO DOS TESTES NO LINUX
          export CMAKE_ARGS="-DTB_BUILD_UNIT_TESTS=OFF"
          ./CI-linux.sh

      - name: Linux - Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          name: TRENCH-Linux
          path: |
            cmakebuild/*.zip
            cmakebuild/*.md5

      # --- RELEASE SECTION ---
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          draft: false
          files: |
            cmakebuild/*.zip
            cmakebuild/*.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}