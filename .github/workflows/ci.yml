name: TRENCH CI
on:
  push:
    tags:
      - '**'
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  # --- JOB WINDOWS ---
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      # DESATIVADO: Binary caching externo. O vcpkg vai apenas compilar localmente.
      VCPKG_BINARY_SOURCES: "clear" 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'

      - name: Windows - Bootstrap vcpkg
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat

      - name: Windows - Install dependencies (Pandoc)
        run: |
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/2.11.3.1/pandoc-2.11.3.1-windows-x86_64.zip' -OutFile 'pandoc.zip'
          7z x pandoc.zip -o'.'
          $tb_pandoc_path = "$(pwd)\pandoc-2.11.3.1"
          echo "$tb_pandoc_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Windows - Build
        run: |
          set CMAKE_ARGS="-DTB_WARNINGS_AS_ERRORS=OFF -DTB_BUILD_UNIT_TESTS=OFF"
          cmd.exe /c CI-windows.bat

      - name: Windows - Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            cmakebuild/*.zip
            cmakebuild/*.zip.md5

  # --- JOB LINUX ---
  build-linux:
    runs-on: ubuntu-22.04
    env:
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      VCPKG_BINARY_SOURCES: "clear"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'

      - name: Linux - Bootstrap vcpkg
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Linux - Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install gcc-13 g++-13 build-essential libxi-dev libxrandr-dev libxxf86vm-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libglm-dev pandoc cmake p7zip-full ninja-build xvfb libglew-dev libfreeimage-dev libfreetype6-dev libtinyxml2-dev libassimp-dev libfuse2

      - name: Linux - Set compiler version
        run: |
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Linux - Build
        run: |
          export CMAKE_ARGS="-DTB_BUILD_UNIT_TESTS=OFF"
          ./CI-linux.sh

      - name: Linux - Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            cmakebuild/*.zip
            cmakebuild/*.md5

  # --- RELEASE JOB ---
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: ./release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}