name: Build and Release TRENCH

on:
  push:
    tags:
      - 'v*' # Dispara ao subir tags (ex: v2026.1)

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Essencial para o vcpkg

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        # O CMake já é nativo no windows-latest, não precisa de Action externa
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build TRENCH
        run: |
          cmake --build build --config Release --target TrenchBroom

      - name: Bundle Release
        shell: pwsh
        run: |
          # 1. Criar a pasta que será zipada
          mkdir TRENCH_Dist
          
          # 2. Copiar o executável e o PDB corrigido
          cp build/app/Release/TRENCH.exe TRENCH_Dist/
          cp build/app/Release/TRENCH-stripped.pdb TRENCH_Dist/
          
          # 3. Copiar todas as DLLs que o CMake jogou na pasta do binário
          cp build/app/Release/*.dll TRENCH_Dist/

          # 4. Copiar as pastas de recursos (repare nos nomes das pastas que você tem)
          $resources = @("games", "shader", "fonts", "defaults", "images", "stylesheets", "manual")
          foreach ($folder in $resources) {
            if (Test-Path "build/app/Release/$folder") {
              cp -Recurse "build/app/Release/$folder" "TRENCH_Dist/"
            }
          }

          # 5. Criar o arquivo ZIP final
          Compress-Archive -Path TRENCH_Dist/* -DestinationPath TRENCH_Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TRENCH_Windows.zip
          name: TRENCH ${{ github.ref_name }}
          body: |
            Release oficial do TRENCH para o ecossistema Amana SDK.
            Estúdio: Amana Games.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}